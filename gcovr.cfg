#
# Owl configuration for GCOVR
#

# --- main options --
print-summary = yes
decisions = yes
delete-input-files = yes
calls = no

# --- sorting ---
sort_reverse = no
sort-branches = no
# possible sort 'file' (default), 'uncovered-percent', 'uncovered-number'
sort = uncovered-percent

# --- Output infos ---
html = yes
html-nested = yes
html-details-syntax-highlighting = yes
html-title = Evenement Loto Coverage Report
# Possible themes:  'green'(default), 'blue', 'github.blue', 'github.green', 'github.dark-green', 'github.dark-blue'
html-theme = github.dark-green
html-high-threshold = 80.0
html-medium-threshold = 65.0
html-static-report = yes

# --- gcov configuration ---
gcov-parallel = yes
gcov-ignore-parse-errors = negative_hits.warn

# --- filtering ---
exclude-throw-branches = yes
exclude-noncode-lines = yes
exclude-unreachable-branches = yes

# .. source file filtering ..
filter = .*source/core/.*|.*source/gui.*
# Only what genuinely cannot run without a window or a GPU is excluded. The autosave
# and the save paths used to be hidden behind `.*Application.*` and `.*gui/actions.*` —
# the most critical code of the project was not measured at all. Their numbers may be
# low, which is the point: a low number one can see is worth more than no number.
exclude = .*test.*|.*MainWindow.*|.*gui/vulkan.*|.*third_party.*

# .. line of code  filtering ..
exclude-lines-by-pattern = .*---UNCOVER---.*
